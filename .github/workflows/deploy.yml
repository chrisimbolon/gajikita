# =============================================================================
# .github/workflows/deploy.yml — SeeGaji: test → build → ship to the droplet
# Adapted from Arthasee's deploy.yml (same smart-rebuild rules, same hard
# checks), with three deliberate differences:
#   1. The deploy job NEEDS the test job: main is never deployed untested.
#   2. Code reaches the droplet by rsync from the runner, not `git pull` on
#      the droplet: no deploy key, no git checkout on the server to drift.
#   3. Health check uses SeeGaji's open /api/health/ (expects 200 + DB up).
#   4. Droplet-side steps are real scripts (deploy/remote-*.sh), never heredocs piped
#      over ssh: on the first deploy `docker compose run` ate the piped script after the
#      migrations and the job still went green (12 Nov 2026).
# Smart rebuild rules:
#   - push:              only rebuild what changed (backend/ or frontend/)
#   - workflow_dispatch: always rebuild EVERYTHING (emergency full deploy)
# Secrets needed (repo → Settings → Secrets and variables → Actions):
#   SECRET_KEY, DB_PASSWORD, SSH_PRIVATE_KEY, SSH_HOST, SSH_USER
# =============================================================================
name: Deploy SeeGaji to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-seegaji
  cancel-in-progress: false   # never kill a deploy halfway; queue the next one

env:
  APP_DIR: /home/apps/seegaji
  DOMAIN:  seegaji.com

jobs:
  # ── 0. Tests (431+) — the deploy job waits for this ────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       seegaji_test
          POSTGRES_USER:     seegaji
          POSTGRES_PASSWORD: seegaji_test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY:  ci-secret-key-not-for-production
      DB_NAME:     seegaji_test
      DB_USER:     seegaji
      DB_PASSWORD: seegaji_test_pass
      DB_HOST:     localhost
      DB_PORT:     "5432"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (pycairo for slips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/base.txt
      - name: Check for model changes without a migration
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:

      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole push may hold several commits; we diff against github.event.before

      # ── 2. Detect what changed (same rules as Arthasee) ─────
      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true"  >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "🔧 Manual trigger — deploying EVERYTHING"; exit 0
          fi
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "backend=true"  >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "⚠️  No usable base SHA ($BASE_SHA) — deploying EVERYTHING to be safe"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "=== Changed files ($BASE_SHA..HEAD) ==="; echo "$CHANGED"; echo "====================="
          # The droplet's container (if any) must also exist; first deploy is forced below.
          if echo "$CHANGED" | grep -qE "^backend/|^docker-compose\.yml$|^docker-compose\.prod\.yml$"; then
            echo "backend=true"  >> $GITHUB_OUTPUT; echo "✅ Backend/compose changed"
          else
            echo "backend=false" >> $GITHUB_OUTPUT; echo "⏭️  Backend unchanged"
          fi
          if echo "$CHANGED" | grep -qE "^frontend/"; then
            echo "frontend=true"  >> $GITHUB_OUTPUT; echo "✅ Frontend changed"
          else
            echo "frontend=false" >> $GITHUB_OUTPUT; echo "⏭️  Frontend unchanged"
          fi

      # ── 3. SSH + what the droplet already has ───────────────
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Check droplet state
        id: droplet
        run: |
          # the static site must be (re)built when it is missing, not only when frontend/ changed
          if ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "test -f $APP_DIR/frontend/out/index.html" </dev/null; then
            echo "site_missing=false" >> $GITHUB_OUTPUT; echo "static site present"
          else
            echo "site_missing=true"  >> $GITHUB_OUTPUT; echo "⚠️  static site missing on the droplet — will build it"
          fi

      # ── 4. Build the static frontend (if it changed or is missing) ─
      - name: Setup Node
        if: steps.changes.outputs.frontend == 'true' || steps.droplet.outputs.site_missing == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Next.js static export
        if: steps.changes.outputs.frontend == 'true' || steps.droplet.outputs.site_missing == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://seegaji.com
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          test -f out/index.html && test -f out/login.html || { echo "❌ static export incomplete"; exit 1; }

      # ── 5. Write production .env (always) ───────────────────
      - name: Write .env file
        env:
          SECRET_KEY:  ${{ secrets.SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          [ -n "$SECRET_KEY" ] && [ -n "$DB_PASSWORD" ] || { echo "❌ SECRET_KEY / DB_PASSWORD secret missing"; exit 1; }
          printf '%s\n' \
            "SECRET_KEY=${SECRET_KEY}" \
            "DEBUG=False" \
            "DJANGO_SETTINGS_MODULE=config.settings.production" \
            "ALLOWED_HOSTS=seegaji.com,www.seegaji.com" \
            "CORS_ALLOWED_ORIGINS=https://seegaji.com" \
            "CSRF_TRUSTED_ORIGINS=https://seegaji.com,https://www.seegaji.com" \
            "FRONTEND_BASE_URL=https://seegaji.com" \
            "DB_NAME=seegaji" \
            "DB_USER=seegaji" \
            "DB_PASSWORD=${DB_PASSWORD}" \
            "DB_HOST=seegaji_db" \
            "DB_PORT=5432" \
            > .env

      # ── 6. Ship code + .env (always) ────────────────────────
      # rsync, not git pull: the droplet needs no GitHub access. frontend/ is
      # excluded here (only its built out/ goes up, in step 7), and excluded
      # paths are never deleted by --delete, so out/, .env and deploy.log survive.
      - name: Upload code to droplet
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p $APP_DIR/frontend/out"
          rsync -az --delete \
            --exclude '.git/' --exclude 'frontend/' --exclude '.env' --exclude 'deploy.log' \
            --exclude 'anth_files/' --exclude '**/anth_files/' \
            --exclude '__pycache__/' --exclude 'backend/media/' --exclude 'backend/staticfiles/' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/
          rsync -az .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/.env
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "chmod 600 $APP_DIR/.env"

      # ── 7. Upload the static site (if built) ───────────────
      - name: Upload static export
        if: steps.changes.outputs.frontend == 'true' || steps.droplet.outputs.site_missing == 'true'
        run: |
          rsync -az --delete frontend/out/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/frontend/out/

      # ── 8. Backend: build, backup, migrate, recreate (if changed or not running)
      - name: Deploy backend
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash $APP_DIR/deploy/remote-backend.sh ${{ steps.changes.outputs.backend }}" </dev/null

      # ── 9. Nightly backup schedule (always; idempotent) ─────
      - name: Install backup schedule
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            chmod +x $APP_DIR/deploy/*.sh &&
            install -m 644 $APP_DIR/deploy/seegaji-backup.cron /etc/cron.d/seegaji-backup &&
            echo '✅ /etc/cron.d/seegaji-backup installed'"

      # ── 10. Health check + Caddy reload (always; fails the run on any problem)
      - name: Health check and Caddy reload
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash $APP_DIR/deploy/remote-health.sh ${{ github.sha }}" </dev/null
