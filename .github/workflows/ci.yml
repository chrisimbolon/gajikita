# =============================================================================
# CI for branches and pull requests. Pushes to main are tested inside
# deploy.yml instead (its deploy job waits for the tests), so main is never
# tested twice and never deployed untested.
# =============================================================================
name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       seegaji_test
          POSTGRES_USER:     seegaji
          POSTGRES_PASSWORD: seegaji_test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY:  ci-secret-key-not-for-production
      DB_NAME:     seegaji_test
      DB_USER:     seegaji
      DB_PASSWORD: seegaji_test_pass
      DB_HOST:     localhost
      DB_PORT:     "5432"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (pycairo for slips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/base.txt
      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=1

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
